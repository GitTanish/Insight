name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      INSIGHT_TRACING: "off"
      INSIGHT_QUERY_CACHE: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Generate evaluation datasets
        run: python evaluation/generate_datasets.py

      - name: Test suite (offline, no API keys)
        run: pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit declared dependencies
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t insight:ci .

      - name: Scan image (fail on critical vulnerabilities)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: insight:ci
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
